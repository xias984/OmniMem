name: Extension CI

on:
  push:
    branches: [main]
    paths: ["extension/**", ".github/workflows/extension-ci.yml", ".github/scripts/validate-extension-manifest.js"]
  pull_request:
    paths: ["extension/**", ".github/workflows/extension-ci.yml", ".github/scripts/validate-extension-manifest.js"]

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JS syntax
        run: |
          for f in extension/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate manifest.json
        run: node .github/scripts/validate-extension-manifest.js

      - name: Package extension
        run: |
          cd extension
          zip -r ../omnimem-extension.zip . -x '*.DS_Store'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnimem-extension
          path: omnimem-extension.zip
