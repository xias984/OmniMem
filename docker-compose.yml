services:

  # ── ChromaDB — database vettoriale ──────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "8000:8000"      # esposto su host per il server MCP locale
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Ollama — embedding locale ────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    profiles: ["with-ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    # Per GPU NVIDIA: decommenta le righe seguenti
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Init — scarica il modello al primo avvio ─────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["with-ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    restart: "no"

  # ── Neo4j — knowledge graph (Hybrid GraphRAG) ────────────────────────────────
  # Opt-in: parte solo con `docker compose --profile with-graphrag up`, oppure
  # sempre se OMNIMEM_GRAPHRAG_ENABLED/OMNIMEM_GRAPH_INDEXING_ENABLED sono
  # true (vedi README/docs/graph-rag-operations.md). Di default il sistema
  # continua a funzionare solo con ChromaDB, senza alcuna regressione.
  neo4j:
    image: neo4j:5-community
    profiles: ["with-graphrag"]
    environment:
      # Formato richiesto dall'immagine ufficiale: "utente/password".
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-changeme-in-env}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE_SIZE:-512M}
      - NEO4J_PLUGINS=[]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"      # Neo4j Browser (debug/ispezione manuale del grafo)
      - "7687:7687"      # Bolt — usato dal server e dalla CLI di backfill
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/7687'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Bridge server — Node.js/Express ─────────────────────────────────────────
  server:
    build: ./server
    ports:
      - "3000:3000"      # esposto su host per l'estensione Chrome
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE=${OLLAMA_BASE:-http://ollama:11434}
      - CHROMA_URL=http://chromadb:8000
      - CODEBASE_HOST_PATH=${CODEBASE_HOST_PATH:-.}
      - API_TOKEN=${API_TOKEN:-}
      # ── GraphRAG (tutti false di default: nessun cambiamento rispetto a oggi) ──
      - OMNIMEM_GRAPHRAG_ENABLED=${OMNIMEM_GRAPHRAG_ENABLED:-false}
      - OMNIMEM_GRAPH_INDEXING_ENABLED=${OMNIMEM_GRAPH_INDEXING_ENABLED:-false}
      - OMNIMEM_GRAPH_SHADOW_MODE=${OMNIMEM_GRAPH_SHADOW_MODE:-false}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme-in-env}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    volumes:
      # Bind-mount della codebase host per /api/ingest-codebase.
      # Default: la directory corrente (dove sta docker-compose.yml).
      # Override con CODEBASE_HOST_PATH nel .env per puntare ad altre cartelle.
      - ${CODEBASE_HOST_PATH:-.}:/workspace:ro
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:    # dati ChromaDB persistenti
  ollama_data:    # modelli Ollama (nomic-embed-text ~274 MB)
  neo4j_data:     # knowledge graph persistente
  neo4j_logs:     # log Neo4j
